name = "dgii-purchase-tracker"
main = "src/index.ts"
compatibility_date = "2024-01-15"

[[kv_namespaces]]
binding = "CONVERSATION_STATE"
id = "488338031c444415a19e4b955fd96321"

[triggers]
crons = ["0 8 * * *"]

[ai]
binding = "AI"

# Workers Logs: keeps request logs (3 days on Free, 7 on Paid) so failures can be
# investigated after the fact instead of only through a live `wrangler tail`.
[observability]
enabled = true

[vars]
# These are placeholders - set actual values via `wrangler secret put`
# TELEGRAM_BOT_TOKEN = ""
# TELEGRAM_WEBHOOK_SECRET = ""
# GOOGLE_SERVICE_ACCOUNT_EMAIL = ""
# GOOGLE_PRIVATE_KEY = ""
# SPREADSHEET_FOLDER_ID = ""
